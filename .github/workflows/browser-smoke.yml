# Manual browser plumbing verification with safe, synthetic text only.
name: Optional browser smoke
on:
  workflow_dispatch:
    inputs:
      expect-failure:
        description: Deliberately fail the synthetic smoke to verify trace/screenshot artifacts.
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    uses: ./.github/workflows/quality-gate.yml
    with:
      config: ${{ inputs.expect-failure && 'examples/browser-smoke/browser-failure.json' || 'examples/browser-smoke/browser.json' }}
      browser-evidence: true
      report-name: browser-smoke-report
