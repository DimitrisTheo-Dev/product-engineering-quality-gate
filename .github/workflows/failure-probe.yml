# Manual release verification; intentionally fails and never runs on pull requests.
name: Expected failure demonstration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: failure-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  expected-failure:
    uses: ./.github/workflows/quality-gate.yml
    with:
      typecheck-script: intentionally-missing-quality-gate-probe
      product-script: test:product
      report-name: expected-failure-report
