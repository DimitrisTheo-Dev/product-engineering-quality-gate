      - name: Verify the gate report and step outcome
        id: verdict
        if: ${{ !cancelled() }}
        shell: bash
        env:
          QG_OUTCOME: ${{ steps.checks.outcome }}
          QG_BROWSER_EVIDENCE: ${{ inputs.browser-evidence }}
          QG_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          node --input-type=module <<'QUALITY_GATE_ASSERT'
          import { appendFileSync, lstatSync, readFileSync, realpathSync, readdirSync } from "node:fs";
          import { isAbsolute, join, relative, resolve, sep } from "node:path";

          export function verifyReport(root, outcome) {
            try {
              const dir = join(root, ".quality-gate");
              const path = join(dir, "report.json");
              if (lstatSync(dir).isSymbolicLink() || !lstatSync(path).isFile())
                throw new Error("Expected a regular report file.");
              const report = JSON.parse(readFileSync(path, "utf8"));
              if (
                report.schemaVersion !== 2 ||
                typeof report.passed !== "boolean" ||
                !Array.isArray(report.checks) ||
                report.checks.some((row) => !["PASS", "FAIL", "SKIPPED"].includes(row.status)) ||
                report.passed !== !report.checks.some((row) => row.status === "FAIL") ||
                !["success", "failure"].includes(outcome) ||
                report.passed !== (outcome === "success")
              )
                throw new Error("The report verdict and the checks step outcome must agree.");
              return report.passed;
            } catch (error) {
              throw new Error(
                "Quality gate evidence could not be verified. Review checkout, setup, and check logs.",
                { cause: error },
              );
            }
          }

          export function browserEvidence(root, requested) {
            const outputs = {};
            if (!requested || isAbsolute(requested)) return outputs;
            try {
              const checkout = realpathSync(root);
              const cwd = realpathSync(resolve(checkout, requested));
              const path = relative(checkout, cwd);
              if (
                isAbsolute(path) ||
                path === ".." ||
                path.startsWith(`..${sep}`) ||
                !/^[\w./ -]*$/.test(path)
              )
                return outputs;
              for (const [key, folder] of [
                ["browserResults", "test-results"],
                ["browserReport", "playwright-report"],
              ]) {
                const dir = join(cwd, folder);
                if (
                  lstatSync(dir, { throwIfNoEntry: false })?.isDirectory() &&
                  !readdirSync(dir, { recursive: true, withFileTypes: true }).some((entry) =>
                    entry.isSymbolicLink(),
                  )
                )
                  outputs[key] = join(path || ".", folder) + "/";
              }
            } catch {
              // An unavailable evidence directory leaves the original verdict intact.
            }
            return outputs;
          }

          export function publishVerdict() {
            const root = process.env.GITHUB_WORKSPACE ?? process.cwd();
            const passed = verifyReport(root, process.env.QG_OUTCOME);
            const outputs = { passed };
            if (!passed && process.env.QG_BROWSER_EVIDENCE === "true")
              Object.assign(outputs, browserEvidence(root, process.env.QG_WORKING_DIRECTORY));
            if (process.env.GITHUB_OUTPUT)
              appendFileSync(
                process.env.GITHUB_OUTPUT,
                Object.entries(outputs)
                  .map(([key, value]) => `${key}=${value}\n`)
                  .join(""),
              );
          }

          publishVerdict();
          QUALITY_GATE_ASSERT
      - name: Upload machine-readable quality report
        id: report
        if: ${{ !cancelled() && steps.checks.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.report-name }}
          path: |-
            .quality-gate/report.json
            .quality-gate/summary.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Link the uploaded report
        id: report_link
        if: ${{ !cancelled() && steps.report.outputs.artifact-url != '' }}
        shell: bash
        env:
          QG_REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          node --input-type=module <<'QUALITY_GATE_REPORT_LINK'
          import { appendFileSync } from "node:fs";
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, "\n[Download the JSON and Markdown report](" + process.env.QG_REPORT_URL + ")\n");
          QUALITY_GATE_REPORT_LINK
      - name: Save dependency downloads on default-branch cache miss
        id: save
        if: ${{ success() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.plan.outputs.key != '' && steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          key: ${{ steps.plan.outputs.key }}
          path: ${{ steps.plan.outputs.path }}
      - name: Upload opted-in browser failure evidence
        if: ${{ failure() && (steps.verdict.outputs.browserResults != '' || steps.verdict.outputs.browserReport != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.report-name }}-browser-failure
          path: |-
            ${{ steps.verdict.outputs.browserResults }}
            ${{ steps.verdict.outputs.browserReport }}
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 3
