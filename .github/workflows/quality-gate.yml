name: Reusable product engineering quality gate
on:
  workflow_call:
    inputs:
      working-directory:
        description: Package directory relative to the checkout. Installation stays at the checkout root.
        required: false
        type: string
        default: .
      config:
        description: Quality gate JSON config relative to the selected package.
        required: false
        type: string
        default: quality-gate.config.json
      deep:
        description: Run deep checks.
        required: false
        type: boolean
        default: false
      check-timeout-seconds:
        description: Per-script timeout, 1–1200 seconds.
        required: false
        type: number
        default: 300
      node-version:
        description: Node.js version.
        type: string
        default: 24.22.2
      report-name:
        description: Unique report artifact name.
        type: string
        default: quality-report
      browser-evidence:
        description: Upload test-results and playwright-report on check failure.
        type: boolean
        default: false
    outputs:
      passed:
        description: Verified gate verdict.
        value: ${{ jobs.quality.outputs.passed }}
      report:
        description: Name of the uploaded report artifact.
        value: ${{ jobs.quality.outputs.report }}
permissions:
  contents: read
jobs:
  quality:
    name: Product engineering quality gate
    runs-on: ubuntu-24.04
